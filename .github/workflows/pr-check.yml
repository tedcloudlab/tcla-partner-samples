name: PR Check

# 外部からの Pull Request に対して、自動でチェックを実行する。
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pull Request 側(フォーク元)のコードをチェックアウトしている。
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # 注意: PR 側のコードは実行しない(ビルドやテストは走らせない)。
      # ファイルの一覧を出すだけの無害なステップ。
      - name: List changed files
        run: |
          echo "PR #${{ github.event.pull_request.number }} を受け取りました"
          echo "ファイル一覧:"
          ls -la
